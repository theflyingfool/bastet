description: "Files, directories, links, and blocks or lines inside other files."
options:
  files:
    type: map
    description: "Whole files by absolute path"
    items:
      type: object
      fields:
        content: {type: string}
        template: {type: string, description: "A Jinja2 template in the inventory (path from its root); gets host, name, lab"}
        owner: {type: string}
        group: {type: string}
        mode: {type: string, description: 'Quoted, e.g. "0644"'}
        validate: {type: string, description: "Command checking the new file first; %s is its path"}
        secret: {type: bool, description: "Never show the contents"}
        restart: {type: list, items: {type: string}, description: "Units to restart when this changes"}
        reload: {type: list, items: {type: string}, description: "Units to reload (or restart) when this changes"}
  directories:
    type: map
    description: "Directories by absolute path"
    items:
      type: object
      fields:
        owner: {type: string}
        group: {type: string}
        mode: {type: string}
  links:
    type: map
    description: "Symlinks: path -> target"
    items: {type: string}
  blocks:
    type: list
    description: "A marked block inside a file"
    items:
      type: object
      fields:
        path: {type: string, required: true}
        marker: {type: string, required: true}
        block: {type: string, required: true}
        comment: {type: string, description: "Comment character for the markers (default #)"}
        validate: {type: string}
        secret: {type: bool, description: "Never show the contents"}
        restart: {type: list, items: {type: string}, description: "Units to restart when this changes"}
        reload: {type: list, items: {type: string}, description: "Units to reload (or restart) when this changes"}
  lines:
    type: list
    description: "One line inside a file"
    items:
      type: object
      fields:
        path: {type: string, required: true}
        line: {type: string, required: true}
        match: {type: string, description: "Regex for the line to replace"}
        unique: {type: bool, description: "With match: also remove the other uncommented lines it matches (for settings that may appear more than once)"}
        after: {type: string, description: "Regex: when the line isn't there yet, insert it after the last line matching this (instead of at the end)"}
        validate: {type: string}
        secret: {type: bool, description: "Never show the contents"}
        restart: {type: list, items: {type: string}, description: "Units to restart when this changes"}
        reload: {type: list, items: {type: string}, description: "Units to reload (or restart) when this changes"}
  commands:
    type: list
    description: "Escape hatch: run a command unless a check command succeeds (use a real option when one exists)"
    items:
      type: object
      fields:
        name: {type: string, required: true}
        run: {type: string, required: true, description: "The command"}
        unless: {type: string, required: true, description: "Skip when this command exits 0"}
        root: {type: bool, description: "Run as root (default true)"}
examples:
  - title: A file, a directory and a link
    yaml: |
      files:
        /etc/motd:
          content: "Managed by Bastet\n"
          mode: "0644"
      directories:
        /srv/app:
          mode: "0750"
      links:
        /srv/current: /srv/app
  - title: One line in someone else's file
    yaml: |
      lines:
        - path: /etc/ssh/sshd_config
          line: PermitRootLogin no
          match: "^#?PermitRootLogin"

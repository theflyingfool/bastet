description: "Users, groups, SSH keys and sudoers rules."
starter:
  users:
    root: {password: "secret:root_password"}
    bastet: {system: true}
options:
  users:
    type: map
    description: "Users by name. root and bastet are always there; entries you list merge over them"
    default: {root: {}, bastet: {system: true}}
    merge_default: true
    items:
      type: object
      fields:
        uid: {type: int}
        group: {type: string, description: "Primary group"}
        groups: {type: list, items: {type: string}, description: "Supplementary groups"}
        append: {type: bool, description: "Only add groups (default); false = exactly these"}
        comment: {type: string}
        home: {type: string}
        create_home: {type: bool}
        move_home: {type: bool}
        shell: {type: string}
        system: {type: bool}
        password_hash: {type: string, secret: true, description: "crypt hash, e.g. from mkpasswd -m sha-512"}
        password: {type: string, secret: true, description: "Plain-text password; Bastet hashes it in the host's own scheme (yescrypt where the host defaults to it, otherwise SHA-512) on the machine running Bastet. Set it with a secret: reference, never write it in the note"}
        update_password: {type: string, choices: [always, on_create]}
        locked: {type: bool}
        expires: {type: string, description: "YYYY-MM-DD or never"}
        max_days: {type: int}
        min_days: {type: int}
        warn_days: {type: int}
        inactive_days: {type: int}
        non_unique: {type: bool}
        skeleton: {type: string}
        keys:
          type: list
          description: "Authorized SSH keys; a key line, or a map with options"
          items:
            type: object
            shorthand: key
            fields:
              key: {type: string, required: true}
              options: {type: string, description: 'e.g. from="10.0.10.0/24",no-agent-forwarding'}
              path: {type: string, description: "Custom authorized_keys path"}
              state: {type: string, choices: [present, absent], description: "absent revokes the key"}
        sudo:
          type: object
          description: "A sudoers rule for this user (/etc/sudoers.d/<user>)"
          fields:
            commands: {type: list, items: {type: string}}
            runas: {type: string}
            hosts: {type: string}
            nopasswd: {type: bool}
            setenv: {type: bool}
            defaults: {type: list, items: {type: string}}
  groups:
    type: map
    description: "Groups by name"
    items:
      type: object
      fields:
        gid: {type: int}
        system: {type: bool}
        members: {type: list, items: {type: string}}
        append_members: {type: bool, description: "Only add members; default sets exactly these"}
  sudoers:
    type: map
    description: "Sudoers files by name (/etc/sudoers.d/<name>)"
    items:
      type: object
      fields:
        rules: {type: list, items: {type: string}, description: "Raw sudoers lines"}
        user: {type: string}
        group: {type: string}
        commands: {type: list, items: {type: string}}
        runas: {type: string}
        hosts: {type: string}
        nopasswd: {type: bool}
        setenv: {type: bool}
        defaults: {type: list, items: {type: string}}
  allowed:
    type: list
    items: {type: string}
    description: "Account names that are fine without a role; they are left out of the report of accounts no role manages"
  report_unaccounted:
    type: bool
    default: true
    description: "Report accounts on the host that no role manages or allows (never changes or removes them)"
  report_system_accounts:
    type: bool
    default: true
    description: "Include root, bastet and system accounts such as nobody and systemd-* in that report on purpose; false lists only accounts in the login.defs UID_MIN to UID_MAX range (the first real run shows how noisy this is and decides whether the default changes)"
examples:
  - title: Report accounts nothing manages, except a few
    yaml: |
      allowed:
        - root
        - bastet
      report_system_accounts: false
  - title: A user with an SSH key and passwordless sudo
    yaml: |
      users:
        alice:
          shell: /bin/bash
          groups:
            - wheel
          keys:
            - ssh-ed25519 AAAAC3Nza...example alice@laptop
          sudo:
            nopasswd: true
  - title: A group with exactly these members
    yaml: |
      groups:
        media:
          gid: 2001
          members:
            - alice
            - jellyfin

description: "Packages and package repositories for apt, pacman, dnf, zypper and apk."
options:
  refresh: {type: bool, default: true, description: "Refresh the package index before installing (no effect on pacman)"}
  install_recommends: {type: bool, description: "apt recommends / dnf weak deps / zypper recommends; unset = distro default"}
  full_upgrade: {type: bool, default: false, description: "Upgrade the whole system as part of installing (pacman -Syu, apt full-upgrade, …)"}
  default_release: {type: string, description: "apt only: install from this release (-t), e.g. trixie-backports"}
  allow_change_held: {type: bool, default: false, description: "apt only: allow changing held packages"}
  dpkg_options: {type: list, items: {type: string}, description: "apt only: dpkg options; default keeps changed config files (--force-confdef --force-confold)"}
  extra_args: {type: list, items: {type: string}, description: "Extra arguments for the package manager (e.g. --enablerepo=crb)"}
  install:
    type: list
    description: "Packages to install; a name, or a map with per-package knobs"
    items:
      type: object
      shorthand: name
      fields:
        name: {type: string, required: true}
        version: {type: string, description: "Exact version (not on pacman); rpm accepts a version without release"}
        install_recommends: {type: bool}
        default_release: {type: string}
        allow_change_held: {type: bool}
        dpkg_options: {type: list, items: {type: string}}
        extra_args: {type: list, items: {type: string}}
        refresh: {type: bool}
        full_upgrade: {type: bool}
        manager: {type: string, choices: [apt-get, pacman, dnf, zypper, apk], description: "Fail unless the host uses this manager"}
  remove:
    type: list
    description: "Packages to remove"
    items:
      type: object
      shorthand: name
      fields:
        name: {type: string, required: true}
        purge: {type: bool, description: "Also remove config (apt purge, pacman -Rns, apk --purge)"}
        manager: {type: string, choices: [apt-get, pacman, dnf, zypper, apk], description: "Fail unless the host uses this manager"}
        dpkg_options: {type: list, items: {type: string}}
        allow_change_held: {type: bool}
        extra_args: {type: list, items: {type: string}}
  repositories:
    type: list
    description: "Package repositories, written in the host's own format"
    items:
      type: object
      fields:
        name: {type: string, required: true}
        uris: {type: list, items: {type: string}, required: true}
        suites: {type: list, items: {type: string}, description: "apt only"}
        components: {type: list, items: {type: string}, description: "apt only"}
        types: {type: list, items: {type: string}, description: "apt only (deb, deb-src)"}
        architectures: {type: list, items: {type: string}, description: "apt only"}
        key: {type: string, description: "Public key text (armored/PEM)"}
        key_name: {type: string, description: "apk only: key file name in /etc/apk/keys"}
        signed_by: {type: string, description: "Path or URL of an existing key"}
        enabled: {type: bool}
        trusted: {type: bool}
        options: {type: map, items: {type: string}, description: "Extra fields in the repository's own format"}
  updates:
    type: string
    default: manual
    choices: [manual, auto, security]
    description: "manual: check reports pending updates, apply installs them only with --updates. auto: apply installs them. security: apply installs security updates (apt, dnf, zypper)"
  reboot:
    type: string
    default: ask
    choices: [never, ask, auto]
    description: "After apply, when the host needs a reboot (new kernel, /run/reboot-required): never = only report it; ask = ask (never under -y); auto = reboot and wait for the host. Bastet never reboots the machine it runs on."
  reboot_timeout: {type: int, default: 600, description: "Seconds to wait for the host to come back after a reboot"}
  updates_exclude: {type: list, items: {type: string}, description: "Never upgrade these (pacman --ignore, dnf --exclude, …)"}
  allowed: {type: list, items: {type: string}, description: "Packages that are fine without a role (not reported as unaccounted)"}
  report_unaccounted: {type: bool, default: true, description: "Report packages installed outside Bastet (explicitly installed, not in the system set, no role, not allowed)"}
examples:
  - title: Lab-wide (put in _roles/lab/packages.md) — apply updates, ask before rebooting
    yaml: |
      updates: auto
      reboot: ask
  - title: Keep the system updated automatically, holding one package back
    yaml: |
      updates: auto
      updates_exclude:
        - linux-lts
      allowed:
        - steam
  - title: Install a few packages
    yaml: |
      install:
        - tree
        - htop
  - title: Pin one version, skip recommended packages
    yaml: |
      install_recommends: false
      install:
        - name: jq
          version: "1.7.1-3"
  - title: Remove a package, add a repository
    yaml: |
      remove:
        - nano
      repositories:
        - name: backports
          uris:
            - http://deb.debian.org/debian
          suites:
            - trixie-backports
          components:
            - main
          signed_by: /usr/share/keyrings/debian-archive-keyring.gpg

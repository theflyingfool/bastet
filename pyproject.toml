[project]
name = "bastet"
version = "0.2.1"
description = "A human-readable, Markdown-based homelab inventory and orchestrator"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyrage>=1.2",
    "rich>=13",
]

[project.scripts]
bastet = "bastet.cli.app:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["refs", ".superpowers"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "B008",  # typer declares options as call defaults
    "B905",  # zip() without strict=
    "UP046", "UP047",  # PEP 695 generics: a style change, not a fix
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E741",  # short names like l in comprehensions
    "E402",  # imports after sys.path setup
    "B017",  # pytest.raises(Exception) where the type is not the point
    "B023",  # closures over loop variables that run in the loop
]

[tool.ruff.lint.isort]
known-first-party = ["bastet"]
